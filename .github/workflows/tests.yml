name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dépendances minimales (les tests utilisent un faux Qt, pas besoin de PySide6)
        run: python -m pip install numpy pytest
      - name: tests du port pyphantom (tests/)
        run: python -m pytest tests/ -q
      - name: tests du port RadioLab (tests_radiolab/)
        run: python -m pytest tests_radiolab/ -q
