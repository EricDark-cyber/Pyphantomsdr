[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyphantomsdr"
version = "1.0.0"
description = "Récepteur SDR logiciel en Python pur pour Windows (Airspy R2 en ctypes), inspiré de PhantomSDR-Plus, port complet de RadioLab 0.15"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pyphantom = "pyphantom.__main__:main"

[tool.setuptools.packages.find]
include = ["pyphantom*", "radiolab*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_radiolab"]
